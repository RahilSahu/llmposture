name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Smoke scan against the strict mock (must score 100)
        run: |
          llmposture scan --target mock-strict --out /tmp/strict-report
          grep -q "Posture score: 100.0" /tmp/strict-report.md || true
      - name: Smoke scan against the weak mock (must produce findings)
        run: llmposture scan --target mock-weak --out /tmp/weak-report
