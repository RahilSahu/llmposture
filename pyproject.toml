[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmposture"
version = "1.1.0"
description = "LLMPosture: a security scanner that tests large language models for prompt injection, leakage, jailbreak, and agency flaws using benign canary probes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rahil Sahu" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "fastapi>=0.110"]
keywords = ["llm", "security", "prompt-injection", "red-team", "owasp", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
llmposture = "llmposture.cli:main"

[project.urls]
Homepage = "https://github.com/RahilSahu/llmposture"
Repository = "https://github.com/RahilSahu/llmposture"
Issues = "https://github.com/RahilSahu/llmposture/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmposture = ["probe_data/*.yaml"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
